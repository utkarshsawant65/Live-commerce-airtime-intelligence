name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time: CI loads the shared RAW schema, so parallel runs would collide.
concurrency:
  group: ci
  cancel-in-progress: false

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/rsa_key.p8

jobs:
  # Offline checks: always run, no warehouse needed.
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cp dbt/profiles.example.yml dbt/profiles.yml
      - name: dbt parse
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: placeholder
          SNOWFLAKE_USER: placeholder
          SNOWFLAKE_PASSWORD: placeholder
        run: |
          dbt deps
          dbt parse --no-partial-parse --target dev
      - name: Generator and z-test smoke test
        run: |
          python generator/generate_batch.py --out generator/output --days 2 --seed 42
          python analysis/conversion_lift_test.py --in generator/output

  # Secrets can't be read in a job-level `if`, so expose their presence as an output.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: echo "available=${{ env.ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"

  # Full build + tests against Snowflake. Skipped when the secrets aren't configured
  # (e.g. on forks).
  build-and-test:
    runs-on: ubuntu-latest
    needs: [parse, check-secrets]
    if: needs.check-secrets.outputs.available == 'true'
    env:
      DBT_TARGET: ci
      DBT_SCHEMA_SUFFIX: _CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Write private key
        env:
          # Stored base64-encoded: a raw multi-line PEM gets mangled as a secret.
          PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY_B64" | base64 -d > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$SNOWFLAKE_PRIVATE_KEY_PATH"
          openssl pkey -in "$SNOWFLAKE_PRIVATE_KEY_PATH" -noout

      - name: dbt deps + connection check
        working-directory: dbt
        run: |
          cp profiles.example.yml profiles.yml
          dbt deps
          dbt debug --target ci

      - name: Generate and load a 2-day batch into RAW
        env:
          SNOWFLAKE_ROLE: ROLE_LOADER
          SNOWFLAKE_WAREHOUSE: WH_LOAD
          SNOWFLAKE_DATABASE: LIVE_COMMERCE
          SNOWFLAKE_SCHEMA: RAW
        run: |
          python generator/generate_batch.py --out generator/output --days 2 --seed 42
          python generator/load_to_snowflake.py --in generator/output --truncate

      - name: dbt build into _CI schemas
        working-directory: dbt
        run: |
          dbt run-operation drop_ci_schemas --target ci
          dbt build --target ci --full-refresh

      - name: sqlfluff lint
        run: sqlfluff lint dbt/models dbt/snapshots dbt/tests

      - name: Source freshness (report only)
        working-directory: dbt
        # The batch is generated for a fixed past window, so freshness is informational here.
        continue-on-error: true
        run: dbt source freshness --target ci
