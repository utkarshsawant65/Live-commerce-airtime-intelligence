name: 'live_commerce'
version: '1.0.0'
config-version: 2
# 1.10+: generic tests use the `arguments:` syntax; snapshots use `schema` and `hard_deletes`.
require-dbt-version: ">=1.10.0"

profile: 'live_commerce'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Minutes after a segment ends during which orders still attribute to it.
  # Must match LAG_MINUTES in the generator.
  attribution_lag_minutes: 30
  # fact_order_line re-processes rows this far behind its latest event_ts_utc.
  incremental_lookback_minutes: 120

# Schema names come from generate_schema_name (STAGING, MARTS, ... with no prefix).
models:
  live_commerce:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      # A view rather than ephemeral so the attribution model can be unit tested.
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  live_commerce:
    # Seeds are staging inputs, not BI-facing; keeping them out of MARTS also avoids
    # a name clash with the dim_channel model.
    +schema: staging
    seed_channel:
      +column_types:
        channel_id: integer

snapshots:
  live_commerce:
    +schema: snapshots
