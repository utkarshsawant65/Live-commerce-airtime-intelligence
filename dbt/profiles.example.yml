# Copy to ~/.dbt/profiles.yml, or to dbt/profiles.yml (gitignored).
# dev uses password auth; ci uses key-pair auth.
live_commerce:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ROLE_TRANSFORMER
      warehouse: WH_TRANSFORM
      database: LIVE_COMMERCE
      schema: MARTS            # fallback only; every layer sets its own +schema
      threads: 4
      client_session_keep_alive: false

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: ROLE_TRANSFORMER
      warehouse: WH_TRANSFORM
      database: LIVE_COMMERCE
      schema: MARTS
      threads: 4
