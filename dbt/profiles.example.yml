# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR to the dbt/ folder and
# name it profiles.yml). The real profiles.yml is gitignored — never commit secrets.
#
# Auth: password for local dev; key-pair (private_key_path) is preferred for CI.
live_commerce:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ROLE_TRANSFORMER
      warehouse: WH_TRANSFORM
      database: LIVE_COMMERCE
      schema: MARTS            # default schema; models route to their own via +schema
      threads: 4
      client_session_keep_alive: false

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # CI uses key-pair auth (no interactive password).
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: ROLE_TRANSFORMER
      warehouse: WH_TRANSFORM
      database: LIVE_COMMERCE
      schema: MARTS
      threads: 4
