version: 2

snapshots:
  - name: dim_product_snapshot
    description: >
      Capture-time audit trail of the current product row: records when each change was
      first seen by a snapshot run. dim_product uses the source's own validity dates.
    columns:
      - name: product_id
        description: Natural product key.
        data_tests: [not_null]
      - name: dbt_valid_from
        description: Snapshot run time at which this version was captured.
      - name: dbt_valid_to
        description: Capture time of the next version; null for the current version.
