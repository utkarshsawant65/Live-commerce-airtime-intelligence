version: 2

models:
  - name: fact_order_line
    description: "One row per product line per order. Incremental (merge on order_line_id)."
    columns:
      - name: order_line_id
        description: Degenerate key; the grain of the fact.
        data_tests: [not_null, unique]
      - name: order_id
        data_tests: [not_null]
      - name: product_key
        description: FK to the dim_product version valid at event_ts_utc.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: attributed_segment_id
        description: FK to fact_airtime_segment.segment_id, or -1 for organic.
        data_tests: [not_null]
      - name: event_ts_utc
        description: Order time (UTC).
        data_tests: [not_null]
      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: net_amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: is_airtime_attributed
        data_tests: [not_null]
      - name: loaded_at_utc
        description: When the source row was loaded into RAW; drives the incremental filter.

  - name: fact_airtime_segment
    description: "One row per broadcast segment (one product on air in one continuous window)."
    columns:
      - name: segment_id
        data_tests: [not_null, unique]
      - name: daypart
        description: Daypart derived from the segment's start hour.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [morning, afternoon, prime_time, late_night]
      - name: is_prime_time
        data_tests: [not_null]
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: presenter_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_presenter')
                field: presenter_key
      - name: show_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_show')
                field: show_key
      - name: channel_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: segment_duration_minutes
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: fact_returns
    description: "One row per returned order line."
    columns:
      - name: return_id
        data_tests: [not_null, unique]
      - name: order_line_id
        description: FK to fact_order_line.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_order_line')
                field: order_line_id
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: returned_qty
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: refund_amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: fact_traffic
    description: "One row per channel per minute: concurrent viewers and web sessions."
    columns:
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: minute_ts_utc
        data_tests: [not_null]
      - name: web_sessions
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [channel_id, minute_ts_utc]
