version: 2

models:
  - name: dim_date
    description: "One row per calendar day across the range of order, return, segment and traffic dates."
    columns:
      - name: date_key
        description: Hash of date_day. Facts join on the date column, not this key.
        data_tests: [not_null, unique]
      - name: date_day
        data_tests: [not_null, unique]
      - name: calendar_year
        data_tests: [not_null]

  - name: dim_time_minute
    description: "One row per minute of the day (1440 rows), with daypart and prime-time flag."
    columns:
      - name: time_minute_key
        data_tests: [not_null, unique]
      - name: minute_of_day
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1439
                inclusive: true
      - name: daypart
        data_tests:
          - accepted_values:
              arguments:
                values: [morning, afternoon, prime_time, late_night]

  - name: dim_product
    description: >
      One row per product version (SCD2 on the source's own validity dates), plus the
      unknown member (product_id = -1). Facts join to the version valid at event time.
    columns:
      - name: product_key
        description: Surrogate key per version (hash of product_id and product_version).
        data_tests: [not_null, unique]
      - name: product_id
        description: Natural key (not unique across versions).
        data_tests: [not_null]
      - name: product_version
        description: Source version number, 1 = earliest; 0 for the unknown member.
        data_tests: [not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Fashion, Jewellery, Beauty, Home & Living, Electronics, Wellness, Unknown]
      - name: list_price_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [budget, mid, premium, luxury, unknown]
      - name: valid_from_ts
        description: Start of the version's validity (inclusive).
      - name: valid_to_ts
        description: End of the version's validity (exclusive); 9999-12-31 for the current version.
      - name: is_current
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, valid_from_ts]

  - name: dim_presenter
    description: "One row per presenter (SCD1), plus the unknown member (-1)."
    columns:
      - name: presenter_key
        data_tests: [not_null, unique]
      - name: presenter_id
        data_tests: [not_null, unique]
      - name: experience_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rookie, established, star, unknown]

  - name: dim_show
    description: "One row per show (SCD1), plus the unknown member (-1)."
    columns:
      - name: show_key
        data_tests: [not_null, unique]
      - name: show_id
        data_tests: [not_null, unique]

  - name: dim_channel
    description: "One row per channel from seed_channel, plus the unknown member (-1)."
    columns:
      - name: channel_key
        data_tests: [not_null, unique]
      - name: channel_id
        data_tests: [not_null, unique]
      - name: channel_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [broadcast, online, phone, unknown]
