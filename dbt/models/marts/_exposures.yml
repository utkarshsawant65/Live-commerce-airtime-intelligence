version: 2

exposures:
  - name: live_commerce_dashboard
    label: "Live Commerce Airtime Dashboard"
    type: dashboard
    maturity: high
    url: https://app.powerbi.com/  # replace with the published report URL
    description: >
      Power BI report on revenue per broadcast minute, on-air conversion and returns by
      presenter, product and channel. Reads only from MARTS.
    depends_on:
      - ref('mart_kpi_metrics')
      - ref('mart_segment_performance')
      - ref('mart_conversion_windows')
      - ref('dim_product')
      - ref('dim_presenter')
      - ref('dim_channel')
      - ref('dim_show')
      - ref('dim_date')
      - ref('dim_time_minute')
      - ref('fact_order_line')
      - ref('fact_airtime_segment')
      - ref('fact_returns')
      - ref('fact_traffic')
    owner:
      name: Analytics
      email: analytics@example.com
