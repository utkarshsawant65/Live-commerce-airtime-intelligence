version: 2

models:
  - name: mart_kpi_metrics
    description: >
      Additive KPI base measures at event_date x product_key x presenter_key x channel_key
      x attributed_segment_id. Ratios are derived in BI.
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: presenter_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_presenter')
                field: presenter_key
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: gmv
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: net_revenue_after_returns
        data_tests: [not_null]
      - name: units_sold
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [event_date, product_key, presenter_key, channel_key, attributed_segment_id]

  - name: mart_segment_performance
    description: "One row per airtime segment with attributed orders, revenue and revenue per broadcast minute."
    columns:
      - name: segment_id
        data_tests: [not_null, unique]
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: presenter_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_presenter')
                field: presenter_key
      - name: segment_duration_minutes
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: revenue_per_broadcast_minute
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: mart_conversion_windows
    description: >
      Orders and web sessions on online channels at airtime_state x event_date x
      channel_key x daypart. A minute is on_air if it falls in any segment's window
      [start_ts_utc, end_ts_utc + attribution_lag_minutes).
    columns:
      - name: airtime_state
        description: on_air or off_air, by the minute of the order or traffic row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [on_air, off_air]
      - name: event_date
        data_tests: [not_null]
      - name: channel_key
        description: Online channels only.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: daypart
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [morning, afternoon, prime_time, late_night]
      - name: orders
        description: Distinct orders placed in the slice.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: web_sessions
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: conversion_rate
        description: orders / web_sessions for the row; null when there are no sessions. Do not average across rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [airtime_state, event_date, channel_key, daypart]
