version: 2

sources:
  - name: raw
    description: >
      RAW landing tables loaded by generator/load_to_snowflake.py (PUT to the internal
      stage raw.stg_landing, then COPY INTO). The data is synthetic, from
      generator/generate_batch.py. Every row carries a loaded_at_utc audit column.
      Only staging models read from here.
    database: LIVE_COMMERCE
    schema: RAW
    config:
      loaded_at_field: loaded_at_utc
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}

    tables:
      - name: dim_product
        description: One row per product per version.
      - name: dim_presenter
        description: One row per presenter.
      - name: dim_show
        description: One row per show.
      - name: dim_channel
        description: >
          One row per channel as emitted by the generator. Models use the seed_channel
          seed instead.
      - name: fact_airtime_segment
        description: One row per broadcast segment (one product on air in one continuous window).
      - name: fact_order_line
        description: One row per product line per order (typed CSV feed).
        config:
          freshness:
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
      - name: fact_returns
        description: One row per returned order line.
      - name: fact_traffic
        description: One row per channel per minute.
      - name: order_line_raw
        description: >
          The order-line JSON feed landed as VARIANT, one row per payload object.
          Parsed and validated in stg_order_lines_variant.
        config:
          freshness:
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
