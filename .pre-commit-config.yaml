# Install once with `pre-commit install`.
# The sqlfluff hook uses the dbt templater, so it needs dbt/profiles.yml and the
# Snowflake env vars from .env (see README).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        files: ^dbt/(models|snapshots|tests)/.*\.sql$
        additional_dependencies:
          - dbt-snowflake>=1.10,<2.0
          - sqlfluff-templater-dbt>=4.0,<5
